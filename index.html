<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sample Projects</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
        },
      },
    },
  };
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html { -webkit-font-smoothing: antialiased; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  ::selection { background: #111827; color: #fff; }
</style>
</head>
<body class="bg-white text-gray-900 font-sans">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ---------------------------------------------------------------- utils */

const FX = {
  PHP: { rate: 1, symbol: "₱" },
  USD: { rate: 1 / 56, symbol: "$" },
};

const toBase = (value, currency) => (Number(value) || 0) / FX[currency].rate;

const money = (base, currency) => {
  const { rate, symbol } = FX[currency];
  return (
    symbol +
    (base * rate).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    })
  );
};

/* ------------------------------------------------------------ ui atoms */

function Button({ children, variant = "solid", className = "", ...props }) {
  const base =
    "px-3 py-2 text-sm rounded-md border transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = {
    solid: "bg-gray-900 text-white border-gray-900 hover:bg-gray-700 hover:border-gray-700",
    outline: "bg-white text-gray-900 border-gray-300 hover:border-gray-900",
    ghost: "bg-transparent text-gray-400 border-transparent hover:text-gray-900",
  };
  return (
    <button className={`${base} ${variants[variant]} ${className}`} {...props}>
      {children}
    </button>
  );
}

function Input({ className = "", ...props }) {
  return (
    <input
      className={`w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-md outline-none transition-colors focus:border-gray-900 placeholder:text-gray-400 ${className}`}
      {...props}
    />
  );
}

function Stat({ label, value }) {
  return (
    <div className="border border-gray-200 rounded-lg px-4 py-3">
      <div className="text-[11px] uppercase tracking-wider text-gray-400">{label}</div>
      <div className="mt-1 text-lg font-medium tabular-nums">{value}</div>
    </div>
  );
}

function CurrencyToggle({ currency, setCurrency }) {
  return (
    <div className="inline-flex border border-gray-300 rounded-md overflow-hidden">
      {["PHP", "USD"].map((c) => (
        <button
          key={c}
          onClick={() => setCurrency(c)}
          className={`px-3 py-1.5 text-xs tracking-wide transition-colors ${
            currency === c
              ? "bg-gray-900 text-white"
              : "bg-white text-gray-500 hover:text-gray-900"
          }`}
        >
          {c}
        </button>
      ))}
    </div>
  );
}

function Shell({ title, onBack, right, children }) {
  return (
    <div className="min-h-screen bg-white">
      <header className="border-b border-gray-200 sticky top-0 bg-white/90 backdrop-blur z-10">
        <div className="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between gap-4">
          <div className="flex items-center gap-4 min-w-0">
            <button
              onClick={onBack}
              className="text-sm text-gray-400 hover:text-gray-900 transition-colors shrink-0"
            >
              Back
            </button>
            <span className="h-4 w-px bg-gray-200 shrink-0" />
            <h1 className="text-sm font-medium truncate">{title}</h1>
          </div>
          <div className="shrink-0">{right}</div>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-6 py-8">{children}</main>
    </div>
  );
}

/* ------------------------------------------------------------ inventory */

function Inventory({ currency, setCurrency, onBack }) {
  const [items, setItems] = useState([
    { id: 1, name: "Ballpen, Black", qty: 120, price: 12 },
    { id: 2, name: "A4 Bond Paper", qty: 35, price: 285 },
    { id: 3, name: "USB Flash Drive 32GB", qty: 8, price: 420 },
  ]);

  const [name, setName] = useState("");
  const [qty, setQty] = useState("");
  const [price, setPrice] = useState("");
  const [editId, setEditId] = useState(null);
  const [draft, setDraft] = useState({ name: "", qty: "", price: "" });

  const rate = FX[currency].rate;
  const symbol = FX[currency].symbol;

  const totalUnits = items.reduce((s, i) => s + i.qty, 0);
  const totalValue = items.reduce((s, i) => s + i.qty * i.price, 0);

  const addItem = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    setItems([
      ...items,
      {
        id: Date.now(),
        name: name.trim(),
        qty: Number(qty) || 0,
        price: toBase(price, currency),
      },
    ]);
    setName("");
    setQty("");
    setPrice("");
  };

  const startEdit = (item) => {
    setEditId(item.id);
    setDraft({
      name: item.name,
      qty: String(item.qty),
      price: (item.price * rate).toFixed(2),
    });
  };

  const saveEdit = () => {
    setItems(
      items.map((i) =>
        i.id === editId
          ? {
              ...i,
              name: draft.name.trim() || i.name,
              qty: Number(draft.qty) || 0,
              price: toBase(draft.price, currency),
            }
          : i
      )
    );
    setEditId(null);
  };

  const removeItem = (id) => setItems(items.filter((i) => i.id !== id));

  return (
    <Shell
      title="Inventory"
      onBack={onBack}
      right={<CurrencyToggle currency={currency} setCurrency={setCurrency} />}
    >
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Stat label="Items" value={items.length} />
        <Stat label="Units in stock" value={totalUnits} />
        <Stat label="Inventory value" value={money(totalValue, currency)} />
      </div>

      <form onSubmit={addItem} className="mt-8 grid grid-cols-1 sm:grid-cols-12 gap-2">
        <div className="sm:col-span-5">
          <Input
            placeholder="Item name"
            value={name}
            onChange={(e) => setName(e.target.value)}
          />
        </div>
        <div className="sm:col-span-2">
          <Input
            type="number"
            placeholder="Qty"
            value={qty}
            onChange={(e) => setQty(e.target.value)}
          />
        </div>
        <div className="sm:col-span-3">
          <Input
            type="number"
            step="0.01"
            placeholder={`Unit price (${symbol})`}
            value={price}
            onChange={(e) => setPrice(e.target.value)}
          />
        </div>
        <div className="sm:col-span-2">
          <Button type="submit" className="w-full">
            Add item
          </Button>
        </div>
      </form>

      <div className="mt-6 border border-gray-200 rounded-lg overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-[11px] uppercase tracking-wider text-gray-400 border-b border-gray-200">
                <th className="px-4 py-3 font-medium">Item</th>
                <th className="px-4 py-3 font-medium text-right">Qty</th>
                <th className="px-4 py-3 font-medium text-right">Unit price</th>
                <th className="px-4 py-3 font-medium text-right">Total</th>
                <th className="px-4 py-3 font-medium text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              {items.length === 0 && (
                <tr>
                  <td colSpan="5" className="px-4 py-10 text-center text-sm text-gray-400">
                    No items yet.
                  </td>
                </tr>
              )}

              {items.map((item) =>
                editId === item.id ? (
                  <tr key={item.id} className="border-b border-gray-100 last:border-0 bg-gray-50">
                    <td className="px-4 py-2">
                      <Input
                        value={draft.name}
                        onChange={(e) => setDraft({ ...draft, name: e.target.value })}
                      />
                    </td>
                    <td className="px-4 py-2">
                      <Input
                        type="number"
                        className="text-right"
                        value={draft.qty}
                        onChange={(e) => setDraft({ ...draft, qty: e.target.value })}
                      />
                    </td>
                    <td className="px-4 py-2">
                      <Input
                        type="number"
                        step="0.01"
                        className="text-right"
                        value={draft.price}
                        onChange={(e) => setDraft({ ...draft, price: e.target.value })}
                      />
                    </td>
                    <td className="px-4 py-2 text-right text-gray-400 tabular-nums">
                      {money(toBase(draft.price, currency) * (Number(draft.qty) || 0), currency)}
                    </td>
                    <td className="px-4 py-2">
                      <div className="flex justify-end gap-1">
                        <Button variant="ghost" onClick={saveEdit}>
                          Save
                        </Button>
                        <Button variant="ghost" onClick={() => setEditId(null)}>
                          Cancel
                        </Button>
                      </div>
                    </td>
                  </tr>
                ) : (
                  <tr
                    key={item.id}
                    className="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors"
                  >
                    <td className="px-4 py-3">{item.name}</td>
                    <td className="px-4 py-3 text-right tabular-nums">
                      <span className={item.qty === 0 ? "text-gray-300" : ""}>{item.qty}</span>
                    </td>
                    <td className="px-4 py-3 text-right tabular-nums">
                      {money(item.price, currency)}
                    </td>
                    <td className="px-4 py-3 text-right tabular-nums">
                      {money(item.price * item.qty, currency)}
                    </td>
                    <td className="px-4 py-3">
                      <div className="flex justify-end gap-1">
                        <Button variant="ghost" onClick={() => startEdit(item)}>
                          Edit
                        </Button>
                        <Button variant="ghost" onClick={() => removeItem(item.id)}>
                          Delete
                        </Button>
                      </div>
                    </td>
                  </tr>
                )
              )}
            </tbody>
          </table>
        </div>
      </div>
    </Shell>
  );
}

/* ------------------------------------------------------- trip calculator */

const EMPTY_TRIP = {
  name: "",
  distance: "",
  efficiency: "",
  fuelPrice: "",
  tolls: "",
  other: "",
};

function TripCalculator({ currency, setCurrency, onBack }) {
  const [trips, setTrips] = useState([
    {
      id: 1,
      name: "Manila to Baguio",
      distance: 250,
      efficiency: 12,
      fuelPrice: 58,
      tolls: 480,
      other: 300,
    },
    {
      id: 2,
      name: "Office commute",
      distance: 32,
      efficiency: 15,
      fuelPrice: 58,
      tolls: 0,
      other: 0,
    },
  ]);

  const [form, setForm] = useState(EMPTY_TRIP);
  const [editId, setEditId] = useState(null);
  const [draft, setDraft] = useState(EMPTY_TRIP);

  const symbol = FX[currency].symbol;
  const rate = FX[currency].rate;

  const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });
  const setD = (key) => (e) => setDraft({ ...draft, [key]: e.target.value });

  // All money stored in PHP base
  const compute = (t) => {
    const liters = t.efficiency > 0 ? t.distance / t.efficiency : 0;
    const fuel = liters * t.fuelPrice;
    const total = fuel + t.tolls + t.other;
    return { liters, fuel, total, perKm: t.distance > 0 ? total / t.distance : 0 };
  };

  const addTrip = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    setTrips([
      ...trips,
      {
        id: Date.now(),
        name: form.name.trim(),
        distance: Number(form.distance) || 0,
        efficiency: Number(form.efficiency) || 0,
        fuelPrice: toBase(form.fuelPrice, currency),
        tolls: toBase(form.tolls, currency),
        other: toBase(form.other, currency),
      },
    ]);
    setForm(EMPTY_TRIP);
  };

  const startEdit = (t) => {
    setEditId(t.id);
    setDraft({
      name: t.name,
      distance: String(t.distance),
      efficiency: String(t.efficiency),
      fuelPrice: (t.fuelPrice * rate).toFixed(2),
      tolls: (t.tolls * rate).toFixed(2),
      other: (t.other * rate).toFixed(2),
    });
  };

  const saveEdit = () => {
    setTrips(
      trips.map((t) =>
        t.id === editId
          ? {
              ...t,
              name: draft.name.trim() || t.name,
              distance: Number(draft.distance) || 0,
              efficiency: Number(draft.efficiency) || 0,
              fuelPrice: toBase(draft.fuelPrice, currency),
              tolls: toBase(draft.tolls, currency),
              other: toBase(draft.other, currency),
            }
          : t
      )
    );
    setEditId(null);
  };

  const removeTrip = (id) => setTrips(trips.filter((t) => t.id !== id));

  const summary = useMemo(() => {
    const totals = trips.map(compute);
    return {
      count: trips.length,
      distance: trips.reduce((s, t) => s + t.distance, 0),
      cost: totals.reduce((s, c) => s + c.total, 0),
    };
  }, [trips]);

  return (
    <Shell
      title="Trip Calculator"
      onBack={onBack}
      right={<CurrencyToggle currency={currency} setCurrency={setCurrency} />}
    >
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Stat label="Trips" value={summary.count} />
        <Stat label="Total distance" value={`${summary.distance.toLocaleString()} km`} />
        <Stat label="Total cost" value={money(summary.cost, currency)} />
      </div>

      <form onSubmit={addTrip} className="mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
        <Input placeholder="Trip name" value={form.name} onChange={set("name")} />
        <Input type="number" step="0.1" placeholder="Distance (km)" value={form.distance} onChange={set("distance")} />
        <Input type="number" step="0.1" placeholder="Fuel efficiency (km/L)" value={form.efficiency} onChange={set("efficiency")} />
        <Input type="number" step="0.01" placeholder={`Fuel price / L (${symbol})`} value={form.fuelPrice} onChange={set("fuelPrice")} />
        <Input type="number" step="0.01" placeholder={`Tolls (${symbol})`} value={form.tolls} onChange={set("tolls")} />
        <Input type="number" step="0.01" placeholder={`Other costs (${symbol})`} value={form.other} onChange={set("other")} />
        <div className="lg:col-span-2">
          <Button type="submit" className="w-full">
            Add trip
          </Button>
        </div>
      </form>

      <div className="mt-6 border border-gray-200 rounded-lg overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm whitespace-nowrap">
            <thead>
              <tr className="text-left text-[11px] uppercase tracking-wider text-gray-400 border-b border-gray-200">
                <th className="px-4 py-3 font-medium">Trip</th>
                <th className="px-4 py-3 font-medium text-right">Distance</th>
                <th className="px-4 py-3 font-medium text-right">Fuel</th>
                <th className="px-4 py-3 font-medium text-right">Tolls</th>
                <th className="px-4 py-3 font-medium text-right">Other</th>
                <th className="px-4 py-3 font-medium text-right">Total</th>
                <th className="px-4 py-3 font-medium text-right">Per km</th>
                <th className="px-4 py-3 font-medium text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              {trips.length === 0 && (
                <tr>
                  <td colSpan="8" className="px-4 py-10 text-center text-sm text-gray-400">
                    No trips yet.
                  </td>
                </tr>
              )}

              {trips.map((t) => {
                const c = compute(t);
                if (editId === t.id) {
                  return (
                    <tr key={t.id} className="border-b border-gray-100 last:border-0 bg-gray-50">
                      <td className="px-3 py-2">
                        <Input value={draft.name} onChange={setD("name")} />
                      </td>
                      <td className="px-3 py-2">
                        <Input type="number" className="text-right" value={draft.distance} onChange={setD("distance")} />
                      </td>
                      <td className="px-3 py-2">
                        <Input type="number" className="text-right" value={draft.efficiency} onChange={setD("efficiency")} />
                      </td>
                      <td className="px-3 py-2">
                        <Input type="number" className="text-right" value={draft.fuelPrice} onChange={setD("fuelPrice")} />
                      </td>
                      <td className="px-3 py-2">
                        <Input type="number" className="text-right" value={draft.tolls} onChange={setD("tolls")} />
                      </td>
                      <td className="px-3 py-2">
                        <Input type="number" className="text-right" value={draft.other} onChange={setD("other")} />
                      </td>
                      <td className="px-3 py-2 text-right text-gray-400 tabular-nums">
                        {money(compute({
                          distance: Number(draft.distance) || 0,
                          efficiency: Number(draft.efficiency) || 0,
                          fuelPrice: toBase(draft.fuelPrice, currency),
                          tolls: toBase(draft.tolls, currency),
                          other: toBase(draft.other, currency),
                        }).total, currency)}
                      </td>
                      <td className="px-3 py-2">
                        <div className="flex justify-end gap-1">
                          <Button variant="ghost" onClick={saveEdit}>Save</Button>
                          <Button variant="ghost" onClick={() => setEditId(null)}>Cancel</Button>
                        </div>
                      </td>
                    </tr>
                  );
                }
                return (
                  <tr key={t.id} className="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
                    <td className="px-4 py-3">{t.name}</td>
                    <td className="px-4 py-3 text-right tabular-nums">{t.distance} km</td>
                    <td className="px-4 py-3 text-right tabular-nums text-gray-500">
                      {money(c.fuel, currency)}
                      <span className="block text-[11px] text-gray-300">{c.liters.toFixed(1)} L</span>
                    </td>
                    <td className="px-4 py-3 text-right tabular-nums text-gray-500">{money(t.tolls, currency)}</td>
                    <td className="px-4 py-3 text-right tabular-nums text-gray-500">{money(t.other, currency)}</td>
                    <td className="px-4 py-3 text-right tabular-nums font-medium">{money(c.total, currency)}</td>
                    <td className="px-4 py-3 text-right tabular-nums text-gray-500">{money(c.perKm, currency)}</td>
                    <td className="px-4 py-3">
                      <div className="flex justify-end gap-1">
                        <Button variant="ghost" onClick={() => startEdit(t)}>Edit</Button>
                        <Button variant="ghost" onClick={() => removeTrip(t.id)}>Delete</Button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </Shell>
  );
}

/* ------------------------------------------------------------------ pos */

const TAX_RATE = 0.12;

function POS({ currency, setCurrency, onBack }) {
  const [products, setProducts] = useState([
    { id: 1, name: "Iced Latte", price: 150, stock: 24 },
    { id: 2, name: "Croissant", price: 95, stock: 12 },
    { id: 3, name: "Bottled Water", price: 25, stock: 40 },
    { id: 4, name: "Club Sandwich", price: 185, stock: 9 },
    { id: 5, name: "Chocolate Cookie", price: 60, stock: 18 },
    { id: 6, name: "Orange Juice", price: 110, stock: 15 },
  ]);

  const [cart, setCart] = useState([]);
  const [salesCount, setSalesCount] = useState(0);
  const [revenue, setRevenue] = useState(0);

  const [newProduct, setNewProduct] = useState({ name: "", price: "", stock: "" });

  const symbol = FX[currency].symbol;

  const addToCart = (product) => {
    const line = cart.find((l) => l.id === product.id);
    const currentQty = line ? line.qty : 0;
    if (currentQty >= product.stock) return;
    setCart(
      line
        ? cart.map((l) => (l.id === product.id ? { ...l, qty: l.qty + 1 } : l))
        : [...cart, { id: product.id, qty: 1 }]
    );
  };

  const changeQty = (id, delta) => {
    const product = products.find((p) => p.id === id);
    setCart(
      cart
        .map((l) => {
          if (l.id !== id) return l;
          const next = Math.min(Math.max(l.qty + delta, 0), product ? product.stock : l.qty);
          return { ...l, qty: next };
        })
        .filter((l) => l.qty > 0)
    );
  };

  const removeLine = (id) => setCart(cart.filter((l) => l.id !== id));

  const addProduct = (e) => {
    e.preventDefault();
    if (!newProduct.name.trim()) return;
    setProducts([
      ...products,
      {
        id: Date.now(),
        name: newProduct.name.trim(),
        price: toBase(newProduct.price, currency),
        stock: Number(newProduct.stock) || 0,
      },
    ]);
    setNewProduct({ name: "", price: "", stock: "" });
  };

  const removeProduct = (id) => {
    setProducts(products.filter((p) => p.id !== id));
    setCart(cart.filter((l) => l.id !== id));
  };

  const lines = cart
    .map((l) => {
      const p = products.find((x) => x.id === l.id);
      return p ? { ...l, product: p, total: p.price * l.qty } : null;
    })
    .filter(Boolean);

  const subtotal = lines.reduce((s, l) => s + l.total, 0);
  const tax = subtotal * TAX_RATE;
  const total = subtotal + tax;

  const completeSale = () => {
    if (lines.length === 0) return;
    setProducts(
      products.map((p) => {
        const line = cart.find((l) => l.id === p.id);
        return line ? { ...p, stock: p.stock - line.qty } : p;
      })
    );
    setSalesCount(salesCount + 1);
    setRevenue(revenue + total);
    setCart([]);
  };

  return (
    <Shell
      title="Basic POS"
      onBack={onBack}
      right={<CurrencyToggle currency={currency} setCurrency={setCurrency} />}
    >
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Stat label="Products" value={products.length} />
        <Stat label="Sales completed" value={salesCount} />
        <Stat label="Revenue" value={money(revenue, currency)} />
      </div>

      <div className="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* products */}
        <div className="lg:col-span-2">
          <h2 className="text-[11px] uppercase tracking-wider text-gray-400">Products</h2>

          <form onSubmit={addProduct} className="mt-3 grid grid-cols-1 sm:grid-cols-12 gap-2">
            <div className="sm:col-span-5">
              <Input
                placeholder="Product name"
                value={newProduct.name}
                onChange={(e) => setNewProduct({ ...newProduct, name: e.target.value })}
              />
            </div>
            <div className="sm:col-span-3">
              <Input
                type="number"
                step="0.01"
                placeholder={`Price (${symbol})`}
                value={newProduct.price}
                onChange={(e) => setNewProduct({ ...newProduct, price: e.target.value })}
              />
            </div>
            <div className="sm:col-span-2">
              <Input
                type="number"
                placeholder="Stock"
                value={newProduct.stock}
                onChange={(e) => setNewProduct({ ...newProduct, stock: e.target.value })}
              />
            </div>
            <div className="sm:col-span-2">
              <Button type="submit" className="w-full">
                Add
              </Button>
            </div>
          </form>

          <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
            {products.length === 0 && (
              <p className="text-sm text-gray-400 col-span-2 py-8 text-center border border-dashed border-gray-200 rounded-lg">
                No products yet.
              </p>
            )}
            {products.map((p) => {
              const out = p.stock <= 0;
              return (
                <div
                  key={p.id}
                  className={`border border-gray-200 rounded-lg p-4 flex items-center justify-between gap-3 transition-colors ${
                    out ? "opacity-40" : "hover:border-gray-900"
                  }`}
                >
                  <button
                    disabled={out}
                    onClick={() => addToCart(p)}
                    className="text-left flex-1 min-w-0 disabled:cursor-not-allowed"
                  >
                    <div className="text-sm font-medium truncate">{p.name}</div>
                    <div className="mt-1 text-xs text-gray-400 tabular-nums">
                      {money(p.price, currency)} · {p.stock} in stock
                    </div>
                  </button>
                  <Button variant="ghost" onClick={() => removeProduct(p.id)}>
                    Delete
                  </Button>
                </div>
              );
            })}
          </div>
        </div>

        {/* cart */}
        <div>
          <h2 className="text-[11px] uppercase tracking-wider text-gray-400">Cart</h2>

          <div className="mt-3 border border-gray-200 rounded-lg p-4">
            {lines.length === 0 ? (
              <p className="py-8 text-center text-sm text-gray-400">
                Cart is empty.
              </p>
            ) : (
              <div className="space-y-4">
                {lines.map((l) => (
                  <div key={l.id} className="flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-sm truncate">{l.product.name}</div>
                      <div className="mt-1 text-xs text-gray-400 tabular-nums">
                        {money(l.product.price, currency)} each
                      </div>
                      <div className="mt-2 inline-flex items-center border border-gray-200 rounded-md overflow-hidden">
                        <button
                          onClick={() => changeQty(l.id, -1)}
                          className="w-7 h-7 text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-50"
                        >
                          −
                        </button>
                        <span className="w-8 text-center text-xs tabular-nums">{l.qty}</span>
                        <button
                          onClick={() => changeQty(l.id, 1)}
                          className="w-7 h-7 text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-50"
                        >
                          +
                        </button>
                      </div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className="text-sm tabular-nums">{money(l.total, currency)}</div>
                      <button
                        onClick={() => removeLine(l.id)}
                        className="mt-1 text-[11px] text-gray-400 hover:text-gray-900"
                      >
                        Remove
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="mt-5 pt-4 border-t border-gray-100 space-y-2 text-sm">
              <div className="flex justify-between text-gray-500">
                <span>Subtotal</span>
                <span className="tabular-nums">{money(subtotal, currency)}</span>
              </div>
              <div className="flex justify-between text-gray-500">
                <span>Tax (12%)</span>
                <span className="tabular-nums">{money(tax, currency)}</span>
              </div>
              <div className="flex justify-between font-medium pt-2 border-t border-gray-100">
                <span>Total</span>
                <span className="tabular-nums">{money(total, currency)}</span>
              </div>
            </div>

            <Button
              className="w-full mt-4"
              disabled={lines.length === 0}
              onClick={completeSale}
            >
              Complete sale
            </Button>
          </div>
        </div>
      </div>
    </Shell>
  );
}

/* ------------------------------------------------------------------ app */

function App() {
  const [route, setRoute] = useState("home");
  const [currency, setCurrency] = useState("PHP");

  const open = (id) => {
    setRoute(id);
    window.scrollTo(0, 0);
  };

  const back = () => {
    setRoute("home");
    window.scrollTo(0, 0);
  };

  if (route === "inventory") {
    return <Inventory currency={currency} setCurrency={setCurrency} onBack={back} />;
  }
  if (route === "trip") {
    return <TripCalculator currency={currency} setCurrency={setCurrency} onBack={back} />;
  }
  if (route === "pos") {
    return <POS currency={currency} setCurrency={setCurrency} onBack={back} />;
  }
  return <Home onOpen={open} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
